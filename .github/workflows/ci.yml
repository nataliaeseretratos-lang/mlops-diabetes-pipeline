name: MLOps CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data extraction, validation, and cleaning
        run: |
          python src/data_extraction.py
          python src/data_validation.py
          python src/data_cleaning.py

      - name: Run model training and MLflow quality gate
        run: |
          python src/train.py

      - name: Verify FastAPI app and endpoints
        run: |
          python -c "from fastapi.testclient import TestClient; from src import api; api.load_champion_model(); c = TestClient(api.app); assert c.get('/health').status_code == 200; info = c.get('/model-info'); assert info.status_code == 200 and info.json()['alias'] == 'champion'; print('CI API check OK')"
